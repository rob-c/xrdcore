[build-system]
# Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2 cannot validate.
# Keep isolated and CI builds reproducible until the inspection tool catches up.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "xrdcore"
dynamic = ["version"]
description = "The dependency-free core shared by xrdclient, xgfalclient and xrdarc: safe XML, checksums, log redaction, cancellation, the copy pipeline, thread fan-out, the shared CLI exit codes and the CLI report format"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["xrootd", "gfal", "grid", "wlcg", "hep", "checksum", "adler32", "crc32c"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
]
# Nothing: this is the layer everything else imports, including ``--help``.
dependencies = []

[project.optional-dependencies]
# Hardware-assisted CRC-32C; the pure-Python fallback is a few MB/s.
fast = ["google-crc32c>=1.5"]
dev = [
  "build>=1,<2",
  # tests/test_scorecard.py: xrd-devtools' scorecard gate measures with these.
  "complexipy>=6,<7",
  "mypy>=2.3,<2.5",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/rob-c/xrdcore"
Documentation = "https://github.com/rob-c/xrdcore#readme"
Repository = "https://github.com/rob-c/xrdcore"
Issues = "https://github.com/rob-c/xrdcore/issues"
Changelog = "https://github.com/rob-c/xrdcore/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/xrdcore"]

[tool.hatch.version]
path = "src/xrdcore/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The take-over gate (tests/test_scorecard.py) is xrd-devtools' pytest plugin,
# found in a sibling checkout or CI's .dependencies/ checkout (it cannot be a
# dependency: PyPI refuses direct-URL requirements); without one it skips.
pythonpath = ["src", "../xrd-devtools/src", ".dependencies/xrd-devtools/src"]
timeout = 120
addopts = "-ra"
# >>> xrddevtools sync: pytest-warnings (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Every warning fails the run, ours and third parties' alike; a test that
# expects one says so with ``pytest.warns``.
filterwarnings = ["error"]
# <<< xrddevtools sync: pytest-warnings <<<

# The whole package is gated at the full line-and-branch mark: it is small,
# it has no optional adapters, and every client on the stack runs through it.
# >>> xrddevtools sync: coverage (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.coverage.run]
branch = true
source = ["xrdcore"]
parallel = true

[tool.coverage.report]
# Every line and branch, reached by a test that makes the case happen.
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
# <<< xrddevtools sync: coverage <<<

# >>> xrddevtools sync: ruff (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
  # High-confidence security checks. The wider S family cannot tell the
  # protocol-mandated hashes, parsers and subprocesses of a storage client
  # from unsafe application code, so it is reviewed rather than enabled.
  "S102", "S307", "S506", "S602", "S608", "S609", "S701",
  # Banned APIs: the banned-api table.
  "TID251",
]
# No rule is ignored and there are no per-file ignores: old code passes the
# same checks as new code.
ignore = []
# <<< xrddevtools sync: ruff <<<

# xrdcore is the dependency-free bottom of the chain: no third-party package,
# no protocol (HTTP, TLS, Kerberos) and nothing above it. It owns
# ThreadPoolExecutor (xrdcore.fanout) and XML parsing (xrdcore.safexml), so
# it does not ban them. CONTRIBUTING.md explains each entry.
# >>> xrddevtools sync: banned-api (generated from xrd-devtools/src/xrddevtools/standard) >>>
# What another part of the chain owns, this repository does not do itself:
# each message names the replacement. No entry is scoped by file and nothing
# is ignored; CONTRIBUTING.md's "Banned APIs" explains each one.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib3".msg = "the chain has no third-party HTTP stack: use xrdhttp.session.Session (pooling, redirects, retries; TLS from xrdsec.tls)"
"requests".msg = "the chain has no third-party HTTP stack: use xrdhttp.session.Session (pooling, redirects, retries; TLS from xrdsec.tls)"
"httpx".msg = "the chain has no third-party HTTP stack: use xrdhttp.session.Session (pooling, redirects, retries; TLS from xrdsec.tls)"
"urllib.request".msg = "use xrdhttp.session.Session: urllib's opener has none of the chain's TLS, redirect or retry rules"
"gssapi".msg = "Kerberos GSS-API is xrdsec.krb5.gss (the xrdsec[krb5] extra), one wrapper for every client"
"krb5".msg = "pykrb5 is not a dependency: credential caches are xrdsec.krb5.caches / xrdsec.krb5.ccache, GSS-API is xrdsec.krb5.gss"
"botocore".msg = "S3 signing and the S3 codec are xrdhttp.s3 (the xrdhttp[s3] extra); only xrdhttp.s3 imports botocore"
"boto3".msg = "S3 signing and the S3 codec are xrdhttp.s3 (the xrdhttp[s3] extra); only xrdhttp.s3 imports botocore"
"http.client".msg = "xrdcore speaks no protocol: HTTP is xrdhttp's (xrdhttp.session)"
"ssl".msg = "xrdcore speaks no protocol: TLS contexts are xrdsec.tls's"
"cryptography".msg = "xrdcore has no third-party dependency: cryptography belongs in xrdsec"
"asn1crypto".msg = "xrdcore has no third-party dependency: ASN.1 belongs in xrdsec (xrdsec.der)"
"xrdsec".msg = "xrdcore sits below xrdsec in the chain and never imports it (dependency direction)"
"xrdhttp".msg = "xrdcore sits below xrdhttp in the chain and never imports it (dependency direction)"
"xrdclient".msg = "xrdcore sits below xrdclient in the chain and never imports it (dependency direction)"
"xgfalclient".msg = "xrdcore sits below xgfalclient in the chain and never imports it (dependency direction)"
"xrdarc".msg = "xrdcore sits below xrdarc in the chain and never imports it (dependency direction)"
"xrdwms".msg = "xrdcore sits below xrdwms in the chain and never imports it (dependency direction)"
# <<< xrddevtools sync: banned-api <<<

[tool.ruff.lint.isort]
known-first-party = ["xrdcore"]
# Test modules import the suite's helpers as ``tests.<module>``: local, sorted last.
known-local-folder = ["tests"]

# >>> xrddevtools sync: mypy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.mypy]
# 3.11 is the oldest interpreter any supported platform hands a user.
python_version = "3.11"
strict = true
# <<< xrddevtools sync: mypy <<<
# Everything that is Python: the package and its tests (the release-artifact
# checks are xrd-devtools').
files = ["src", "tests"]
mypy_path = "src"
# The tests directory is a namespace package to mypy, so one override names it.
explicit_package_bases = true

# >>> xrddevtools sync: mypy-overrides (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Tests may leave a fixture-taking test function unannotated, but its body is
# still checked, so a type error (or an unused ignore) in a test fails too.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# <<< xrddevtools sync: mypy-overrides <<<

# >>> xrddevtools sync: complexipy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.complexipy]
# Every function of every Python file, with no snapshot of old offenders.
paths = ["src", "tests"]
max-complexity-allowed = 15
failed = true
# <<< xrddevtools sync: complexipy <<<
